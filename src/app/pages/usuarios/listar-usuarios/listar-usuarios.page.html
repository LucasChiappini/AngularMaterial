<div style="padding: 20px;">
    <h2>Lista de Usuarios</h2>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2" style="width: 100%;">

        <!-- ID -->
        <ng-container matColumnDef="id_usuario">
            <th mat-header-cell *matHeaderCellDef> ID <mat-icon fontIcon="Fingerprint" /></th>
            <td mat-cell *matCellDef="let element"> {{ element.id_usuario }} </td>
        </ng-container>

        <!-- Nombre -->
        <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let element"> {{ element.nombre }} </td>
        </ng-container>

        <!-- Apellido -->
        <ng-container matColumnDef="apellido">
            <th mat-header-cell *matHeaderCellDef> Apellido </th>
            <td mat-cell *matCellDef="let element"> {{ element.apellido }} </td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Email </th>
            <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
        </ng-container>

        <!-- Rol con Chip -->
        <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef> Rol </th>
            <td mat-cell *matCellDef="let element">
                <mat-chip>{{ element.rol }}</mat-chip>
            </td>
        </ng-container>

        <!-- Botón Borrar -->
        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="warn" (click)="eliminar(element.id_usuario)">
                    <mat-icon fontIcon="delete">delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <!-- Filas -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
